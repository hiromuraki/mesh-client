[package]
name = "mesh-install"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# 文案从语言清单取，代码里不写中文（见 docs/i18n.md）。
mesh-text = { workspace = true }
# 只有两件事跨平台不一样：锁（LockFileEx / flock）与版本清单的 JSON 编解码。
# 前者交给 fs4，后者是 serde_json。
fs4 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# 清单签名。启动器也要验，所以验签代码在这里而不是 mesh-remote：那条线会把
# ureq、serde、rand、httpdate 全拖进一个只需要 verifier 的二进制。
ed25519-dalek = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
