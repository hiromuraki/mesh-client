[package]
name = "mesh-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
mesh-install = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
httpdate = { workspace = true }
ureq = { workspace = true }

# Windows 用系统 TLS（schannel），不增体积、也吃系统根证书；Linux musl 静态链 openssl
# 是硬伤，改用 rustls + 系统根证书（native-certs），与 Go 的默认行为一致。
[target.'cfg(windows)'.dependencies]
ureq = { workspace = true, features = ["native-tls"] }

[target.'cfg(unix)'.dependencies]
ureq = { workspace = true, features = ["tls", "native-certs"] }
