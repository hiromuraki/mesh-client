[package]
name = "mesh-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "mesh"
path = "src/main.rs"

[dependencies]
# 搬自 client-launcher/Cargo.toml。版本、失败计数、清单解析换成 mesh-install，
# 所以 serde/serde_json 不再需要；其余依赖与原件一致。
mesh-install = { workspace = true }
mesh-text = { workspace = true }
zstd = { workspace = true }
tar = { workspace = true }

[dev-dependencies]
# 只有测试用得到签发方与摘要：造一份签名正确的清单，证明「验签能过」这条路径真的能过。
# 生产代码的摘要走 mesh-install::artifact，不再自带一份。
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    # 看似没用到，实际是 Win32_UI_Shell 的隐含依赖：去掉它 ShellExecuteExW /
    # SHELLEXECUTEINFOW 会直接不存在。
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# 与客户端同一套：`tls`（rustls）+ `native-certs`（读系统信任库）。
# 只开 `native-tls` 是不够的——它只把 schannel 编进来，不会成为 `ureq::get` 的
# 默认 provider，请求会以「no TLS backend is configured」失败（2026-11-26 就是这么
# 炸的）。启动器的 `--url` 安装走 https 时必须能下。
# Linux 版仍然用系统的 curl，静态 musl 下把 openssl 链进来不值得。
ureq = { workspace = true, features = ["tls", "native-certs"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
