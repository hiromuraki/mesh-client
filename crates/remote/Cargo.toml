[package]
name = "mesh-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
mesh-text = { workspace = true }
mesh-install = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
httpdate = { workspace = true }
# 两个平台统一用 rustls + 系统根证书。
#
# 别改成 Windows 走 native-tls：ureq 的 `native-tls` feature 只是把 schannel 编进来，
# **不会**成为默认 provider——它要求调用方自己在 `AgentBuilder` 上 `.tls_connector()`。
# 只启它不启 `tls` 的话，默认 provider 是那个一律报「no TLS backend is configured」
# 的占位实现，而请求正是在那里失败的。2026-11-26 在 Windows 上就是这么炸的。
ureq = { workspace = true, features = ["tls", "native-certs"] }
